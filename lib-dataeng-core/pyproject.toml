[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataeng-core"
version = "0.1.0"
description = "Biblioteca de engenharia de dados: ingestão, transformação e qualidade."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "pydantic>=2.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "requests>=2.31",
    "sqlglot>=23.0",
]

[project.optional-dependencies]
local = ["duckdb>=1.0"]
gcp = [
    "google-cloud-storage>=2.14",
    "google-cloud-bigquery>=3.17",
    "google-cloud-pubsub>=2.19",
]
spark = ["pyspark>=3.5"]
airflow = [
    "apache-airflow>=2.9",
    "apache-airflow-providers-google>=10.17",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "cookiecutter>=2.6",
    "responses>=0.25",
    "pandas-stubs",
    "types-requests",
    "types-PyYAML",
]

[project.scripts]
dataeng = "dataeng_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["dataeng_core"]

[[tool.mypy.overrides]]
module = ["dataeng_core.base", "dataeng_core.base.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
