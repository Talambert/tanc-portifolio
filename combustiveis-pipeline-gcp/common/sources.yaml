# Manifesto explícito de fontes da ANP (Levantamento de Preços de Combustíveis).
# Lista de URLs em vez de padrão de nome: os arquivos mensais têm nomes irregulares
# (ex.: julho/2026 não leva "2026-07" no nome; fevereiro e abril também fogem do padrão).
# Página oficial: https://www.gov.br/anp/pt-br/centrais-de-conteudo/dados-abertos/serie-historica-de-precos-de-combustiveis
# Formato dos CSVs: UTF-8 com BOM, separador ";", decimal com vírgula, data dd/mm/aaaa.

base_url: https://www.gov.br/anp/pt-br/centrais-de-conteudo/dados-abertos/arquivos/shpc

