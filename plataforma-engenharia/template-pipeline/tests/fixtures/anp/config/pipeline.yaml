schema_version: 1
nome: precos-combustiveis
agenda: "0 6 * * 1"
parametros: {}

etapas:
  - id: ingere_precos
    tipo: ingestao
    origem:
      tipo: arquivo
      localizacao: data/amostra.csv
      formato: csv
      encoding: utf-8-sig
      delimitador: ";"
      schema: schemas/origem_precos.yaml
    destino:
      bronze: "gs://${bucket_bronze}/bronze/precos_combustiveis/"
      tabela: "${dataset_silver}.precos_combustiveis"
      schema: schemas/destino_precos.yaml
      modo_carga: overwrite_particao
      particao: _ingestion_date
      ddl: [sql/ddl/silver_precos.sql]
    transformacao:
      - normalizar: {cnpj_revenda: [apenas_digitos]}
      - tipar:
          valor_venda: {tipo: decimal, separador_decimal: ","}
          data_coleta: {tipo: data, formato: "%d/%m/%Y"}
      - rejeitar_se:
          - {coluna: cnpj_revenda, regra: nao_nulo}
          - {coluna: valor_venda, regra: faixa, minimo: 0}
      - deduplicar: [cnpj_revenda, produto, data_coleta]
    qualidade:
      - nao_nulo: [cnpj_revenda, produto]

  - id: view_preco_medio_uf
    tipo: view
    depende_de: [ingere_precos]
    sql: sql/views/preco_medio_uf.sql

  - id: agrega_uf_produto
    tipo: sql
    depende_de: [ingere_precos]
    sql: [sql/ddl/gold_agregado_uf_produto.sql, sql/dml/agrega_uf_produto.sql]

  - id: checagem_final
    tipo: qualidade
    depende_de: [view_preco_medio_uf, agrega_uf_produto]
    verificacoes:
      - nao_nulo: {tabela: "${dataset_gold}.agregado_uf_produto", colunas: [uf, produto]}
      - unico: {tabela: "${dataset_gold}.agregado_uf_produto", colunas: [uf, produto]}

execucao_padrao:
  cloud_run: {cpu: 1, memoria: 2Gi, timeout: 3600}
