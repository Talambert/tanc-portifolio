# Identidade visual do portal. As cores e a tipografia ficam aqui, não espalhadas pelo código.
#
# Direção: ferramenta de revisão, sóbria e densa. Verde-floresta como única cor de ação; âmbar e
# vermelho reservados a alertas; tipografia IBM Plex (Sans para texto, Mono para identificadores).

[client]
toolbarMode = "minimal"          # esconde "Deploy" e o menu padrão do Streamlit

[server]
enableStaticServing = true       # serve as fontes de portal/static/

[theme]
font = "IBM Plex Sans"
codeFont = "IBM Plex Mono"
baseFontSize = 15
baseRadius = "0.375rem"
buttonRadius = "0.375rem"
showWidgetBorder = true
showSidebarBorder = true
headingFontSizes = ["1.9rem", "1.3rem", "1.1rem", "1.0rem", "0.95rem", "0.85rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontSize = "1.9rem"
metricValueFontWeight = 600

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-400-normal.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-400-italic.woff2"
weight = 400
style = "italic"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-500-normal.woff2"
weight = 500
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-600-normal.woff2"
weight = 600
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-700-normal.woff2"
weight = 700
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/ibm-plex-mono-latin-400-normal.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/ibm-plex-mono-latin-500-normal.woff2"
weight = 500
style = "normal"

# ---------- Tema claro ----------
