greenColor = "#0A5C20"
greenBackgroundColor = "#E3F4E7"
greenTextColor = "#08461A"
orangeColor = "#B25E00"
orangeBackgroundColor = "#FFF1D6"
orangeTextColor = "#7A4100"
yellowColor = "#B7791F"
yellowBackgroundColor = "#FFF6DD"
yellowTextColor = "#6B4A00"
redColor = "#B3261E"
redBackgroundColor = "#FDE7E5"
redTextColor = "#8C1D18"
blueColor = "#1F5FA8"
blueBackgroundColor = "#E7F0FA"
blueTextColor = "#164A85"
grayColor = "#5B6A62"
grayBackgroundColor = "#E9EEEB"
